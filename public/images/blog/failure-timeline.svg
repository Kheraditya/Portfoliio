<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <style>
      .bg{fill:#0b1020}
      .title{fill:#ffffff;font-family:Inter,ui-sans-serif,system-ui; font-size:26px; font-weight:700}
      .sub{fill:#a9b7e6;font-family:Inter,ui-sans-serif,system-ui; font-size:14px}
      .line{stroke:#334b86;stroke-width:3}
      .tick{stroke:#7aa2ff;stroke-width:3}
      .box{fill:#101a33;stroke:#2a3a6a;stroke-width:2}
      .t{fill:#e8eefc;font-family:Inter,ui-sans-serif,system-ui; font-size:16px}
      .s{fill:#a9b7e6;font-family:Inter,ui-sans-serif,system-ui; font-size:13px}
      .warn{fill:#2a1a1a;stroke:#ff6b6b;stroke-width:2}
      .ok{fill:#122a1a;stroke:#50fa7b;stroke-width:2}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="520"/>
  <text class="title" x="50" y="70">Failure Timeline: Push Fails → SMS Fallback → Email Audit</text>
  <text class="sub" x="50" y="102">Shows graceful degradation: dispatch continues even with partial channel failures</text>

  <line class="line" x1="80" y1="200" x2="1120" y2="200"/>
  <!-- ticks -->
  <line class="tick" x1="140" y1="185" x2="140" y2="215"/>
  <line class="tick" x1="360" y1="185" x2="360" y2="215"/>
  <line class="tick" x1="580" y1="185" x2="580" y2="215"/>
  <line class="tick" x1="800" y1="185" x2="800" y2="215"/>
  <line class="tick" x1="1020" y1="185" x2="1020" y2="215"/>

  <!-- boxes -->
  <rect class="box" x="95" y="250" rx="14" ry="14" width="230" height="100"/>
  <text class="t" x="115" y="290">T+0s</text>
  <text class="s" x="115" y="315">Incident created (NEW)</text>

  <rect class="warn" x="315" y="80" rx="14" ry="14" width="280" height="110"/>
  <text class="t" x="335" y="120">T+1–2s</text>
  <text class="s" x="335" y="145">Push send attempted</text>
  <text class="s" x="335" y="168">Result: FAILED / TIMEOUT</text>

  <rect class="ok" x="535" y="250" rx="14" ry="14" width="280" height="110"/>
  <text class="t" x="555" y="290">T+3–6s</text>
  <text class="s" x="555" y="315">SMS fallback triggered</text>
  <text class="s" x="555" y="338">Result: DELIVERED</text>

  <rect class="box" x="755" y="80" rx="14" ry="14" width="280" height="110"/>
  <text class="t" x="775" y="120">T+5–10s</text>
  <text class="s" x="775" y="145">Email audit sent</text>
  <text class="s" x="775" y="168">Stored in dispatch logs</text>

  <rect class="box" x="935" y="250" rx="14" ry="14" width="230" height="100"/>
  <text class="t" x="955" y="290">T+1–5m</text>
  <text class="s" x="955" y="315">Admin ACK/RESOLVE</text>
</svg>
